<!DOCTYPE html>
<html>

<head>

    <title>Forms</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


    <style>
        body {
            background: #f2f6ff;
        }


        .main-card {

            margin-top: 70px;
            background: #fff;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, .15);

        }


        .tab-btn {

            min-width: 180px;
            border-radius: 50px;
            padding: 14px 25px;
            font-weight: 600;
            transition: .3s;

        }


        .tab-btn:hover {

            transform: translateY(-7px);
            box-shadow: 0 15px 25px rgba(0, 0, 0, .2);

        }



        .form-card {

            display: none;
            margin-top: 35px;
            animation: slide .5s ease;

        }


        .form-card.active {

            display: block;

        }



        @keyframes slide {

            from {

                opacity: 0;
                transform: translateY(30px);

            }

            to {

                opacity: 1;
                transform: translateY(0);

            }

        }



        .inner-card {

            background: #f8faff;
            padding: 30px;
            border-radius: 20px;

        }



        .form-control {

            border-radius: 12px;

        }
    </style>


</head>


<body>


    <div class="container">


        <div class="main-card">



            <h2 class="text-center fw-bold mb-5">
                Memorial Registration
            </h2>




            <!-- BUTTONS -->

            <div class="d-flex justify-content-center gap-3 flex-wrap">



                <button class="btn btn-primary tab-btn" onclick="openForm('lab')">

                    <i class="fa-solid fa-flask me-2"></i>
                    LAB

                </button>




                <button class="btn btn-success tab-btn" onclick="openForm('micro')">

                    <i class="fa-solid fa-microchip me-2"></i>
                    MICRO

                </button>




                <button class="btn btn-danger tab-btn" onclick="openForm('ramaiah')">

                    <i class="fa-solid fa-building me-2"></i>
                    MS RAMAIAH MEMORIAL

                </button>



            </div>








            <!-- LAB FORM -->


            <div id="lab" class="form-card active">


                <div class="inner-card">


                    <h4 class="text-primary mb-4">
                        LAB Form
                    </h4>



                    <form class="needs-validation" novalidate onsubmit="submitForm(event)">



                        <div class="mb-3">

                            <label class="form-label">
                                Lab Name
                            </label>


                            <input type="text" class="form-control" placeholder="Enter Lab Name" required>


                            <div class="invalid-feedback">
                                Please enter lab name
                            </div>


                        </div>




                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>


                            <textarea class="form-control" required></textarea>


                            <div class="invalid-feedback">
                                Please enter description
                            </div>


                        </div>



                        <button class="btn btn-primary rounded-pill px-4">
                            Save
                        </button>



                    </form>


                </div>

            </div>










            <!-- MICRO FORM -->


            <div id="micro" class="form-card">


                <div class="inner-card">


                    <h4 class="text-success mb-4">
                        MICRO Form
                    </h4>



                    <form class="needs-validation" novalidate onsubmit="submitForm(event)">



                        <div class="mb-3">

                            <label class="form-label">
                                Micro Name
                            </label>


                            <input type="text" class="form-control" required>


                            <div class="invalid-feedback">
                                Please enter micro name
                            </div>


                        </div>




                        <div class="mb-3">

                            <label class="form-label">
                                Details
                            </label>


                            <textarea class="form-control" required></textarea>


                            <div class="invalid-feedback">
                                Please enter details
                            </div>


                        </div>




                        <button class="btn btn-success rounded-pill px-4">
                            Save
                        </button>



                    </form>



                </div>

            </div>










            <!-- RAMAIAH FORM -->


            <div id="ramaiah" class="form-card">


                <div class="inner-card">


                    <h4 class="text-danger mb-4">
                        MS Ramaiah Memorial Form
                    </h4>




                    <form class="needs-validation" novalidate onsubmit="submitForm(event)">





                        <div class="mb-3">


                            <label class="form-label">
                                Name
                            </label>


                            <input type="text" class="form-control" required>


                            <div class="invalid-feedback">
                                Please enter name
                            </div>


                        </div>





                        <div class="mb-3">

                            <label class="form-label">
                                Message
                            </label>


                            <textarea class="form-control" required></textarea>


                            <div class="invalid-feedback">
                                Please enter message
                            </div>


                        </div>





                        <button class="btn btn-danger rounded-pill px-4">

                            Save

                        </button>




                    </form>



                </div>


            </div>






        </div>


    </div>






    <script>


        // Change Forms

        function openForm(id) {


            document.querySelectorAll('.form-card')
                .forEach(form => {

                    form.classList.remove('active');

                });


            document.getElementById(id)
                .classList.add('active');


        }







        // Validation + SweetAlert

        function submitForm(event) {


            event.preventDefault();


            let form = event.target;



            if (!form.checkValidity()) {


                form.classList.add('was-validated');


                return;

            }




            Swal.fire({

                icon: 'success',

                title: 'Submitted Successfully',

                text: 'Your details saved successfully',

                showConfirmButton: false,

                timer: 2000

            });



            form.reset();

            form.classList.remove('was-validated');


        }



    </script>



</body>

</html>
