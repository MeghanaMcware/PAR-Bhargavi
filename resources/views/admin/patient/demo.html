<div class="container">
    <form class="row g-3">

        <!-- Hospital -->
        <div class="col-lg-6">
            <label class="form-label">Hospital Name</label>
            <select class="form-select" multiple>
                <option>Manipal Airport Road</option>
                <option>Manipal Yeshwanthpur</option>
                <option>Sparsh Yeshwanthpur</option>
                <option>MS Ramiah Teaching Hospital</option>
            </select>
        </div>


        <div class="col-lg-6">
            <label class="form-label">Patient UHID/MRD</label>
            <input type="text" class="form-control" placeholder="Enter UHID/MRD">
        </div>


        <div class="col-lg-6">
            <label class="form-label">Date of Admission</label>
            <input type="date" class="form-control">
        </div>


        <div class="col-lg-6">
            <label class="form-label">Time of Admission</label>
            <input type="time" class="form-control">
        </div>


        <!-- Scores -->

        <div class="col-lg-6">
            <label class="form-label">q-SOFA Score</label>
            <select class="form-select">
                <option>
                    <2< /option>
                <option>>2</option>
            </select>
        </div>


        <div class="col-lg-6">
            <label class="form-label">NEWS Score</label>
            <select class="form-select">
                <option>
                    <7< /option>
                <option>>7</option>
                <option>Not Done</option>
            </select>
        </div>


        <div class="col-lg-6">
            <label class="form-label">MEWS Score</label>
            <select class="form-select">
                <option>0</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
                <option>Not Done</option>
            </select>
        </div>


        <!-- Text fields -->

        <div class="col-lg-6">
            <label class="form-label">Any Comorbidity <5 Years</label>
                    <input class="form-control">
        </div>


        <div class="col-lg-6">
            <label class="form-label">Any Comorbidity >5 Years</label>
            <input class="form-control">
        </div>



        <!-- Radio -->

        <div class="col-lg-6">
            <label class="form-label d-block">
                Patient Type
            </label>

            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="patient">
                <label class="form-check-label">
                    New
                </label>
            </div>

            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="patient">
                <label class="form-check-label">
                    Follow Up
                </label>
            </div>

        </div>



        <!-- Checkbox -->

        <div class="col-lg-6">

            <label class="form-label d-block">
                Symptoms
            </label>

            <div class="form-check">
                <input class="form-check-input" type="checkbox">
                <label class="form-check-label">
                    Fever
                </label>
            </div>


            <div class="form-check">
                <input class="form-check-input" type="checkbox">
                <label class="form-check-label">
                    Cough
                </label>
            </div>


            <div class="form-check">
                <input class="form-check-input" type="checkbox">
                <label class="form-check-label">
                    Breathing Difficulty
                </label>
            </div>

        </div>



        <!-- Select -->

        <div class="col-lg-6">

            <label class="form-label">
                Oxygen Requirement
            </label>

            <select class="form-select">

                <option>Select</option>
                <option>Yes</option>
                <option>No</option>

            </select>

        </div>




        <div class="col-lg-6">

            <label class="form-label">
                Ventilator Support
            </label>

            <select class="form-select">

                <option>Select</option>
                <option>Yes</option>
                <option>No</option>

            </select>

        </div>




        <!-- Textarea -->

        <div class="col-12">

            <label class="form-label">
                Clinical Notes
            </label>

            <textarea class="form-control" rows="3"></textarea>

        </div>



        <!-- File -->

        <div class="col-lg-6">

            <label class="form-label">
                Upload Report
            </label>

            <input type="file" class="form-control">

        </div>



        <!-- Submit -->

        <div class="col-12">

            <button class="btn btn-primary">
                Save
            </button>

            <button type="reset" class="btn btn-secondary">
                Reset
            </button>

        </div>


    </form>
</div>
